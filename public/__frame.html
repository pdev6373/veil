<!doctype html>
<!-- TEMPORARY responsive test harness: delete before deploying.
     Usage: /__frame.html?w=375&h=1400&p=/&scroll=calculator&click=sel1;;sel2 -->
<html><body style="margin:0;background:#888">
<iframe id="f" style="border:0;display:block"></iframe>
<script>
  const q = new URLSearchParams(location.search);
  const f = document.getElementById('f');
  f.style.width = (q.get('w') || 375) + 'px';
  f.style.height = (q.get('h') || 1400) + 'px';
  f.src = q.get('p') || '/';
  f.addEventListener('load', () => {
    setTimeout(() => {
      const doc = f.contentDocument;
      const id = q.get('scroll');
      if (id) doc.getElementById(id)?.scrollIntoView({ behavior: 'instant', block: 'start' });
      const clicks = (q.get('click') || '').split(';;').filter(Boolean);
      clicks.forEach((sel, i) => setTimeout(() => doc.querySelector(sel)?.click(), 200 * (i + 1)));
    }, 1200);
  });
</script>
</body></html>
